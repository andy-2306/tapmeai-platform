<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapMe AI | Internal QR Infrastructure</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load an open-source, client-side QR library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { slate: { 950: '#020617' } } }
            }
        }
    </script>
</head>
<body class="h-full text-slate-100 font-sans antialiased flex flex-col items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-8">
        
        <!-- Header -->
        <div class="text-center border-b border-slate-800 pb-6">
            <div class="inline-flex items-center space-x-2 bg-indigo-500/10 border border-indigo-500/20 rounded-full px-3 py-1 mb-4">
                <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                <span class="text-xs font-mono text-indigo-400 uppercase tracking-widest">Internal Tool</span>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">TapMe AI <span class="text-indigo-400">QR Generator</span></h1>
            <p class="text-sm text-slate-400 mt-2">Generate permanent, high-resolution QR codes for physical standees.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-8 items-start">
            
            <!-- Left Side: Input Controls -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Target URL (Destination)</label>
                    <input type="url" id="targetUrl" placeholder="https://tapmeai.com/review/client-name/" 
                           class="w-full bg-slate-950 border border-slate-700 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    <p class="text-[10px] text-slate-500 mt-2">Always use the permanent tapmeai.com routing link.</p>
                </div>

                <!-- Customization Options -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-2">Foreground Color</label>
                        <input type="color" id="qrColor" value="#000000" class="w-full h-10 rounded cursor-pointer bg-slate-950 border border-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-2">Error Correction</label>
                        <select id="qrLevel" class="w-full bg-slate-950 border border-slate-700 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                            <option value="L">Low (7%)</option>
                            <option value="M">Medium (15%)</option>
                            <option value="Q">Quartile (25%)</option>
                            <option value="H" selected>High (30% - Best for Print)</option>
                        </select>
                    </div>
                </div>

                <button onclick="generateQR()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-lg transition-transform active:scale-95 shadow-lg shadow-indigo-600/20">
                    Generate Matrix
                </button>
            </div>

            <!-- Right Side: Preview & Export -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 flex flex-col items-center justify-center min-h-[300px]">
                
                <div id="qrPreviewContainer" class="bg-white p-4 rounded-xl shadow-inner mb-6 hidden">
                    <!-- The QR Code will render here -->
                    <div id="qrcode"></div>
                </div>
                
                <div id="emptyState" class="text-center text-slate-500">
                    <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5ZM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5ZM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6.75 6.75h.75v.75h-.75v-.75ZM6.75 16.5h.75v.75h-.75v-.75ZM16.5 6.75h.75v.75h-.75v-.75ZM13.5 13.5h.75v.75h-.75v-.75ZM13.5 19.5h.75v.75h-.75v-.75ZM19.5 13.5h.75v.75h-.75v-.75ZM19.5 19.5h.75v.75h-.75v-.75ZM16.5 16.5h.75v.75h-.75v-.75Z" />
                    </svg>
                    <p class="text-sm">Matrix Preview will appear here</p>
                </div>

                <button id="downloadBtn" onclick="downloadQR()" class="hidden w-full bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold py-3 rounded-lg border border-slate-700 transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download High-Res PNG
                </button>

            </div>
        </div>
    </div>

    <script>
        let qrCodeObj = null;

        function generateQR() {
            const url = document.getElementById('targetUrl').value;
            const color = document.getElementById('qrColor').value;
            const levelMap = { 'L': QRCode.CorrectLevel.L, 'M': QRCode.CorrectLevel.M, 'Q': QRCode.CorrectLevel.Q, 'H': QRCode.CorrectLevel.H };
            const level = levelMap[document.getElementById('qrLevel').value];

            if (!url) {
                alert("Please enter a Target URL first.");
                return;
            }

            // Show preview box, hide empty state
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('qrPreviewContainer').classList.remove('hidden');
            document.getElementById('downloadBtn').classList.remove('hidden');

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous

            // We generate it large (1024x1024) internally so the PNG download is ultra-sharp for print
            qrCodeObj = new QRCode(qrContainer, {
                text: url,
                width: 1024,
                height: 1024,
                colorDark : color,
                colorLight : "#ffffff",
                correctLevel : level
            });

            // Scale it down visually so it fits on the screen
            qrContainer.querySelector('img').style.width = '100%';
            qrContainer.querySelector('img').style.height = 'auto';
            qrContainer.querySelector('img').style.maxWidth = '250px';
            
            // Note: HTML5 Canvas is also generated alongside the img. 
            // We use the canvas object to trigger the download in the next function.
        }

        function downloadQR() {
            // Grab the canvas element generated by qrcode.js
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                // Convert the canvas to a high-res PNG data URL
                const imgURL = canvas.toDataURL("image/png");
                
                const clientSlug = document.getElementById('targetUrl').value.split('/').filter(Boolean).pop() || 'client';
                const dlLink = document.createElement('a');
                dlLink.download = `TapMeAI-QR-${clientSlug}-HighRes.png`;
                dlLink.href = imgURL;
                dlLink.dataset.downloadurl = ["image/png", dlLink.download, dlLink.href].join(':');
                
                document.body.appendChild(dlLink);
                dlLink.click();
                document.body.removeChild(dlLink);
            } else {
                alert("Please generate a QR code first.");
            }
        }
    </script>
</body>
</html>
