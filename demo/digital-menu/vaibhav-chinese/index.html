<html lang="en">

    <title>Vaibhav Chinese - Digital Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-brand: #e11d48; /* Chinese Red */
            --veg-color: #22c55e;
            --non-veg-color: #ef4444;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 100px; /* Space for sticky cart */
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-brand);
            font-size: 30px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .table-input-container {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .table-input-container label { font-weight: 500; font-size: 14px; color: var(--text-muted); }
        .table-input-container input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            width: 80px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }
        .table-input-container input:focus { border-color: var(--accent-brand); }

        /* Search & Filters */
        .controls-container {
            padding: 15px 20px;
            position: sticky;
            top: 105px;
            background: var(--bg-color);
            z-index: 99;
            border-bottom: 1px solid var(--border-color);
        }

        .search-bar {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: white;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }
        .search-bar:focus { border-color: var(--accent-brand); }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
        }

        .filter-btn.active-veg { background: rgba(34, 197, 94, 0.15); border-color: var(--veg-color); color: var(--veg-color); }
        .filter-btn.active-nonveg { background: rgba(239, 68, 68, 0.15); border-color: var(--non-veg-color); color: var(--non-veg-color); }

        .type-icon {
            width: 14px; height: 14px;
            border: 2px solid;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 3px;
        }
        .type-icon::after { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .icon-veg { border-color: var(--veg-color); }
        .icon-veg::after { background: var(--veg-color); }
        .icon-nonveg { border-color: var(--non-veg-color); }
        .icon-nonveg::after { background: var(--non-veg-color); }

        /* Menu List */
        .menu-container { padding: 10px 20px; }
        .category-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-brand);
            margin: 25px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 8px;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-details { flex: 1; padding-right: 15px; }
        .item-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
        .item-name { font-weight: 600; font-size: 14px; line-height: 1.3; }
        .item-price { color: var(--text-muted); font-size: 14px; font-weight: 500; }

        /* Add/Quantity Controls */
        .add-controls {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--accent-brand);
            border-radius: 8px;
            overflow: hidden;
            height: 36px;
        }

        .btn-add-init {
            background: rgba(225, 29, 72, 0.1);
            color: var(--accent-brand);
            border: 1px solid var(--accent-brand);
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            height: 36px;
            transition: 0.2s;
        }
        .btn-add-init:hover { background: var(--accent-brand); color: white; }

        .ctrl-btn {
            background: transparent;
            color: var(--accent-brand);
            border: none;
            width: 32px;
            height: 100%;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .qty-display {
            width: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }

        /* Sticky Bottom Cart */
        .cart-bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--accent-brand);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .cart-bottom-bar.visible { transform: translateY(0); }
        .cart-info { font-weight: 700; font-size: 16px; }
        .cart-info span { font-size: 12px; font-weight: 500; display: block; opacity: 0.9; }
        
        .btn-checkout {
            background: white;
            color: var(--accent-brand);
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Checkout Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--card-bg);
            width: 100%;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 30px 20px;
            transform: translateY(100%);
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { font-size: 20px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        
        .payment-options { display: flex; flex-direction: column; gap: 15px; }
        .pay-btn {
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.2s;
        }
        .pay-btn-upi { border-color: #25D366; color: #25D366; }
        .pay-btn-upi:hover { background: rgba(37, 211, 102, 0.1); }
        .pay-btn-cash { border-color: #f59e0b; color: #f59e0b; }
        .pay-btn-cash:hover { background: rgba(245, 158, 11, 0.1); }

        .close-modal {
            margin-top: 20px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 10px;
        }
    </style>
</head>

    <header>

            <h1>Vaibhav Chinese</h1>
        </div>
        <div class="table-input-container">
            <label for="table-no">Table Number:</label>
            <input type="number" id="table-no" placeholder="e.g. 5" min="1" max="99">
        </div>
    </header>

    <div class="controls-container">

                <span class="type-icon icon-veg"></span> Pure Veg
            </button>
            <button class="filter-btn" id="btn-nonveg" onclick="toggleFilter('nonveg')">
                <span class="type-icon icon-nonveg"></span> Non-Veg
            </button>
        </div>
    </div>

    <div class="menu-container" id="menu-container">
        <!-- Menu items will be injected here via JavaScript -->
    </div>

    <!-- Sticky Bottom Cart -->
    <div class="cart-bottom-bar" id="cart-bar">
        <div class="cart-info">
            <div id="cart-total-items">2 Items</div>
            <span>Total: ₹<span id="cart-total-price">0</span></span>
        </div>
        <button class="btn-checkout" onclick="openCheckout()">Place Order ➔</button>
    </div>

    <!-- Checkout Modal -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <div class="modal-header">Select Payment Method</div>
            <div class="payment-options">
                <button class="pay-btn pay-btn-upi" onclick="processOrder('UPI')">
                    📱 Pay via UPI / Online
                </button>
                <button class="pay-btn pay-btn-cash" onclick="processOrder('Cash')">
                    💵 Pay via Cash
                </button>
            </div>
            <div class="close-modal" onclick="closeCheckout()">Cancel</div>
        </div>
    </div>

        // --- STATE VARIABLES ---
        let cart = {}; 
        let currentFilter = 'all'; 

        // --- CORE FUNCTIONS ---
        function initApp() {
            renderMenu();
        }

        function toggleFilter(type) {
            const vegBtn = document.getElementById('btn-veg');
            const nonvegBtn = document.getElementById('btn-nonveg');

            if (currentFilter === type) {
                currentFilter = 'all'; // Deselect
                vegBtn.classList.remove('active-veg');
                nonvegBtn.classList.remove('active-nonveg');
            } else {
                currentFilter = type;
                if(type === 'veg') {
                    vegBtn.classList.add('active-veg');
                    nonvegBtn.classList.remove('active-nonveg');
                } else {
                    nonvegBtn.classList.add('active-nonveg');
                    vegBtn.classList.remove('active-veg');
                }
            }
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();
            container.innerHTML = '';

            // Group by category
            const grouped = {};
            
            menuData.forEach(item => {
                // Apply Search Filter
                if (searchTerm && !item.name.toLowerCase().includes(searchTerm)) return;
                
                // Apply Veg/Non-Veg Filter
                if (currentFilter !== 'all' && item.type !== currentFilter) return;

                if (!grouped[item.cat]) grouped[item.cat] = [];
                grouped[item.cat].push(item);
            });

            // Render DOM
            Object.keys(grouped).forEach(category => {
                const catItems = grouped[category];
                if (catItems.length === 0) return;

                // Category Title
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = category;
                container.appendChild(catTitle);

                // Items
                catItems.forEach(item => {
                    const qty = cart[item.name] ? cart[item.name].qty : 0;
                    const iconClass = item.type === 'veg' ? 'icon-veg' : 'icon-nonveg';
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';
                    
                    let controlsHTML = '';
                    if (qty > 0) {
                        controlsHTML = `
                            <div class="add-controls">
                                <button class="ctrl-btn" onclick="updateCart('${item.name.replace(/'/g, "\\'")}', ${item.price}, -1)">-</button>
                                <div class="qty-display">${qty}</div>
                                <button class="ctrl-btn" onclick="updateCart('${item.name.replace(/'/g, "\\'")}', ${item.price}, 1)">+</button>
                            </div>
                        `;
                    } else {
                        controlsHTML = `
                            <button class="btn-add-init" onclick="updateCart('${item.name.replace(/'/g, "\\'")}', ${item.price}, 1)">ADD</button>
                        `;
                    }

                    itemDiv.innerHTML = `
                        <div class="item-details">
                            <div class="item-header">
                                <span class="type-icon ${iconClass}"></span>
                                <span class="item-name">${item.name}</span>
                            </div>
                            <div class="item-price">₹${item.price}</div>
                        </div>
                        <div class="item-actions">
                            ${controlsHTML}
                        </div>
                    `;
                    container.appendChild(itemDiv);
                });
            });

            if (container.innerHTML === '') {
                container.innerHTML = `<p style="text-align:center; color: #a1a1aa; margin-top: 20px;">No dishes found.</p>`;
            }
        }

        function updateCart(itemName, price, change) {
            if (!cart[itemName]) {
                cart[itemName] = { price: price, qty: 0 };
            }
            
            cart[itemName].qty += change;

            if (cart[itemName].qty <= 0) {
                delete cart[itemName];
            }

            renderMenu(); 
            updateCartUI(); 
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cart-bar');
            let totalItems = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalItems += item.qty;
                totalPrice += (item.qty * item.price);
            });

            if (totalItems > 0) {
                document.getElementById('cart-total-items').innerText = `${totalItems} Item${totalItems > 1 ? 's' : ''}`;
                document.getElementById('cart-total-price').innerText = totalPrice;
                cartBar.classList.add('visible');
            } else {
                cartBar.classList.remove('visible');
                closeCheckout(); 
            }
        }

        // --- CHECKOUT & WHATSAPP LOGIC ---
        function openCheckout() {
            const tableNo = document.getElementById('table-no').value.trim();
            if (!tableNo) {
                alert("Please enter your Table Number at the top of the page before placing an order.");
                window.scrollTo({ top: 0, behavior: 'smooth' });
                document.getElementById('table-no').focus();
                return;
            }
            document.getElementById('checkout-modal').classList.add('active');
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').classList.remove('active');
        }

        function processOrder(paymentMethod) {
            const tableNo = document.getElementById('table-no').value.trim();
            
            let message = `🥢 *NEW ORDER - VAIBHAV CHINESE* 🥢\n\n`;
            message += `📍 *Table No:* ${tableNo}\n`;
            message += `💳 *Payment Method:* ${paymentMethod}\n`;
            message += `---------------------------\n`;

            let totalPrice = 0;
            Object.keys(cart).forEach(itemName => {
                const item = cart[itemName];
                const itemTotal = item.qty * item.price;
                totalPrice += itemTotal;
                message += `▪️ ${item.qty} x ${itemName} (₹${itemTotal})\n`;
            });

            message += `---------------------------\n`;
            message += `💰 *Grand Total:* ₹${totalPrice}\n\n`;
            message += `_Please prepare the order!_`;

            const encodedMessage = encodeURIComponent(message);
            
            // REPLACE THIS NUMBER WITH YOUR RESTAURANT WHATSAPP NUMBER (Country code + number, e.g., 919876543210)
            const whatsappNumber = "919876543210"; 
            
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

            closeCheckout();
            cart = {};
            updateCartUI();
            
            // Uncheck table number to prepare for next potential guest
            document.getElementById('table-no').value = "";
            renderMenu();
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
