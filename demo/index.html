<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapMe AI | Live Interactive Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { slate: { 950: '#020617' } } } } }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-sm w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
        
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-indigo-600/30 blur-3xl rounded-full"></div>

        <div class="relative z-10">
            <div class="h-12 w-12 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white mx-auto mb-6 text-xl shadow-lg shadow-indigo-600/20">T</div>
            
            <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400 mb-2">Live Infrastructure Demo</h2>
            
            <h1 id="dynamicBusinessName" class="text-2xl font-bold text-white mb-8 leading-tight">
                Loading System...
            </h1>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 mb-8">
                <div class="animate-pulse bg-slate-800 h-16 w-16 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                </div>
                <p class="text-sm text-slate-400">Bring your phone close to the NFC hardware to initiate sequence.</p>
            </div>

            <button onclick="simulateTap()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl transition shadow-md shadow-indigo-600/20 active:scale-95">
                Simulate Customer Tap
            </button>
        </div>
    </div>

    <script>
        // Extract the business name from the URL
        const urlParams = new URLSearchParams(window.location.search);
        let businessName = urlParams.get('biz');

        // Fallback if no name is provided
        if (!businessName) {
            businessName = "Your Business";
        }

        // Inject the name into the HTML
        document.getElementById('dynamicBusinessName').innerText = "Routing Engine Ready for " + businessName;

        // The Tap Simulation Logic
        function simulateTap() {
            let button = document.querySelector('button');
            button.innerText = "Connecting to Google...";
            button.classList.add('opacity-75', 'cursor-not-allowed');
            
            setTimeout(() => {
                alert(`SUCCESS! The customer's phone has instantly opened the 5-Star Google Maps rating screen for ${businessName}.`);
                button.innerText = "Simulate Customer Tap";
                button.classList.remove('opacity-75', 'cursor-not-allowed');
            }, 1500);
        }
    </script>
</body>
</html>
