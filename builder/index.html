<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapMe AI | Digital Menu Builder Engine</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars for clean UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="h-full text-slate-100 font-sans antialiased flex flex-col">

    <!-- Top Navigation Header -->
    <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md px-6 py-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-white p-1 rounded-lg shadow-sm">
                <img src="/favicon.png" alt="Logo" class="h-6 w-6 object-contain">
            </div>
            <span class="text-xl font-bold tracking-tight text-white">TapMe AI <span class="text-indigo-500 font-mono text-xs uppercase ml-2 px-2 py-0.5 bg-indigo-500/10 border border-indigo-500/20 rounded">Menu Builder 2.0</span></span>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="exportStaticHTML()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2 rounded-lg transition border border-slate-700 flex items-center gap-2">
                <span>⚡ Export Premium Menu (HTML)</span>
            </button>
            <button onclick="sendToWhatsApp()" class="bg-[#25D366] hover:bg-[#20b858] text-white text-xs font-bold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-lg shadow-[#25D366]/20">
                <span>🚀 Deploy via WhatsApp</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace (Split Screen) -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- LEFT PANEL: Data Input Form -->
        <div class="w-full lg:w-1/2 p-6 overflow-y-auto border-r border-slate-900 space-y-8">
            
            <!-- Section 1: Restaurant Identity -->
            <div class="bg-slate-900/50 border border-slate-900 p-6 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="text-indigo-400">01.</span> Restaurant Identity
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Restaurant Name *</label>
                        <input type="text" id="inputBrandName" value="Vaibhav Chinese" oninput="updatePreview()" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Tagline / Subtitle</label>
                        <input type="text" id="inputTagline" value="Taste the Real Chinese" oninput="updatePreview()" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- Section 2: Add Menu Items -->
            <div class="bg-slate-900/50 border border-slate-900 p-6 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <span class="text-indigo-400">02.</span> Add Menu Item
                </h2>
                
                <form id="itemForm" onsubmit="addMenuItem(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Category *</label>
                            <input type="text" id="itemCategory" placeholder="e.g. Starters, Main Course" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Item Name *</label>
                            <input type="text" id="itemName" placeholder="e.g. Paneer Chilly" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Price (₹) *</label>
                            <input type="number" id="itemPrice" placeholder="169" required class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Dietary Type</label>
                            <select id="itemType" class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                                <option value="veg">🟢 Veg</option>
                                <option value="non-veg">🔴 Non-Veg</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Description (Optional)</label>
                        <input type="text" id="itemDesc" placeholder="Delicious and spicy." class="w-full bg-slate-950 border border-slate-800 rounded-lg py-2.5 px-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold py-3 rounded-lg transition">
                        + Add Item to Menu
                    </button>
                </form>
            </div>

            <!-- Section 3: Active Items List -->
            <div class="bg-slate-900/50 border border-slate-900 p-6 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold text-white flex items-center justify-between">
                    <span><span class="text-indigo-400">03.</span> Menu Inventory</span>
                    <span id="itemCounter" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full font-mono">0 Items</span>
                </h2>
                <div id="itemList" class="space-y-2">
                    <!-- Dynamic items render here -->
                </div>
            </div>

        </div>

        <!-- RIGHT PANEL: Live Smartphone Preview -->
        <div class="w-full lg:w-1/2 bg-slate-950 p-6 flex flex-col items-center justify-center overflow-y-auto">
            <div class="text-center mb-4">
                <span class="text-xs font-mono text-slate-500 uppercase tracking-widest">Builder Internal Preview</span>
            </div>

            <!-- Smartphone Mockup -->
            <div class="w-[360px] h-[680px] bg-slate-900 border-[8px] border-slate-800 rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative">
                <div class="w-32 h-4 bg-slate-800 rounded-b-xl mx-auto shrink-0 z-20"></div>

                <div class="flex-1 overflow-y-auto p-4 space-y-6 text-left bg-slate-950" id="phoneScreen">
                    <div class="text-center pt-2 pb-4 border-b border-slate-900">
                        <h3 id="previewTitle" class="text-2xl font-extrabold text-white">Vaibhav Chinese</h3>
                        <p id="previewTagline" class="text-xs text-slate-400 mt-1">Taste the Real Chinese</p>
                    </div>
                    <div id="previewCategories" class="space-y-6"></div>
                </div>

                <div class="p-3 bg-slate-900/90 border-t border-slate-800 text-center shrink-0">
                    <span class="text-[10px] text-slate-400">Powered by <strong class="text-indigo-400">TapMe AI Engine</strong></span>
                </div>
            </div>
        </div>

    </div>

    <!-- Core Logic & Export Engine -->
    <script>
        let menuItems = [];

        window.onload = () => {
            updatePreview();
        };

        function addMenuItem(event) {
            event.preventDefault();
            
            const category = document.getElementById('itemCategory').value.trim();
            const name = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value.trim();
            const type = document.getElementById('itemType').value;
            const desc = document.getElementById('itemDesc').value.trim();

            menuItems.push({ category, name, price, type, desc });
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemDesc').value = '';

            updatePreview();
        }

        function deleteItem(index) {
            menuItems.splice(index, 1);
            updatePreview();
        }

        function updatePreview() {
            const title = document.getElementById('inputBrandName').value || "Your Restaurant";
            const tagline = document.getElementById('inputTagline').value || "";
            
            document.getElementById('previewTitle').innerText = title;
            document.getElementById('previewTagline').innerText = tagline;
            document.getElementById('itemCounter').innerText = `${menuItems.length} Items`;

            const itemListContainer = document.getElementById('itemList');
            itemListContainer.innerHTML = '';
            
            menuItems.forEach((item, index) => {
                itemListContainer.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-950 border border-slate-800 p-3 rounded-lg text-xs">
                        <div>
                            <span class="font-bold text-white">${item.name}</span>
                            <span class="text-slate-500 ml-2">(₹${item.price})</span>
                            <span class="block text-[10px] text-slate-400">${item.category}</span>
                        </div>
                        <button onclick="deleteItem(${index})" class="text-rose-400 hover:text-rose-300 font-bold px-2 py-1">Remove</button>
                    </div>
                `;
            });

            const categoriesContainer = document.getElementById('previewCategories');
            categoriesContainer.innerHTML = '';

            const grouped = menuItems.reduce((acc, item) => {
                acc[item.category] = acc[item.category] || [];
                acc[item.category].push(item);
                return acc;
            }, {});

            for (const [catName, items] of Object.entries(grouped)) {
                let itemsHTML = '';
                items.forEach(item => {
                    const badge = item.type === 'veg' ? '🟢' : '🔴';
                    itemsHTML += `
                        <div class="bg-slate-900/60 border border-slate-900 p-3 rounded-xl flex justify-between items-start">
                            <div class="space-y-1 pr-2">
                                <div class="text-xs font-bold text-white flex items-center gap-1.5">
                                    <span>${badge}</span>
                                    <span>${item.name}</span>
                                </div>
                            </div>
                            <span class="text-xs font-bold text-indigo-400 font-mono">₹${item.price}</span>
                        </div>
                    `;
                });

                categoriesContainer.innerHTML += `
                    <div class="space-y-2">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-900 pb-1">${catName}</h4>
                        <div class="space-y-2">${itemsHTML}</div>
                    </div>
                `;
            }
        }

        // 🚀 Premium Foodies Fusion Template Export Engine
        function exportStaticHTML() {
            const title = document.getElementById('inputBrandName').value || "Digital Menu";
            const tagline = document.getElementById('inputTagline').value || "Delicious Moments, Fused to Perfection";

            const groupedData = [];
            const categoryMap = new Map();

            menuItems.forEach(item => {
                if (!categoryMap.has(item.category)) {
                    const catObj = {
                        id: item.category.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                        title: item.category,
                        items: []
                    };
                    categoryMap.set(item.category, catObj);
                    groupedData.push(catObj);
                }
                categoryMap.get(item.category).items.push({
                    name: item.name,
                    price: item.price,
                    type: item.type, 
                    desc: item.desc
                });
            });

            const menuDataJSON = JSON.stringify(groupedData, null, 4);

            const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} - Digital Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #F59E0B;
            --veg-color: #22c55e;
            --nonveg-color: #ef4444;
        }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; color: var(--text-main); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .menu-wrapper { max-width: 600px; margin: 0 auto; min-height: 100vh; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        header { padding: 40px 20px 20px; text-align: center; border-bottom: 1px solid var(--glass-border); background: linear-gradient(to bottom, rgba(15,23,42,0.9), rgba(15,23,42,0.6)); }
        .logo { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-gold); margin-bottom: 15px; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2); background: white; padding: 4px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin: 0 0 5px 0; color: var(--accent-gold); letter-spacing: 1px; }
        .slogan { font-size: 14px; color: var(--text-muted); font-style: italic; margin: 0 0 20px 0; }
        .search-container { position: relative; margin: 0 20px 20px; }
        .search-bar { width: 100%; padding: 14px 20px 14px 45px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.05); color: white; font-family: 'Poppins', sans-serif; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--accent-gold); background: rgba(255, 255, 255, 0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .category-nav { display: flex; overflow-x: auto; padding: 15px 20px; gap: 12px; position: sticky; top: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 100; border-bottom: 1px solid var(--glass-border); scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-pill { white-space: nowrap; padding: 8px 20px; border-radius: 30px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--text-main); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; }
        .cat-pill.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: 600; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .menu-section { padding: 25px 20px; animation: fadeIn 0.5s ease-in; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--accent-gold); margin: 0 0 20px 0; padding-bottom: 8px; border-bottom: 1px solid rgba(245, 158, 11, 0.3); display: flex; align-items: center; gap: 10px; }
        .item-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start; transition: transform 0.2s ease; }
        .item-card:active { transform: scale(0.98); }
        .item-info { flex: 1; padding-right: 15px; }
        .item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .veg-indicator { width: 12px; height: 12px; border: 1px solid var(--veg-color); display: flex; align-items: center; justify-content: center; border-radius: 2px; flex-shrink: 0; }
        .veg-indicator::after { content: ''; width: 6px; height: 6px; background: var(--veg-color); border-radius: 50%; }
        .nonveg-indicator { border-color: var(--nonveg-color); }
        .nonveg-indicator::after { background: var(--nonveg-color); }
        .item-name { font-size: 16px; font-weight: 600; color: var(--text-main); margin: 0; }
        .item-desc { font-size: 12px; color: var(--text-muted); margin: 5px 0 0 0; display: block; }
        .item-price { font-size: 16px; font-weight: 700; color: var(--accent-gold); background: rgba(245, 158, 11, 0.1); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
        .no-results { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 16px; display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        footer { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--glass-border); background: rgba(15, 23, 42, 0.8); }
    </style>
</head>
<body>
    <div class="menu-wrapper">
        <header>
            <img src="https://images.unsplash.com/photo-1514933651103-005eec06c04b?w=150&h=150&fit=crop" alt="Logo" class="logo">
            <h1>${title}</h1>
            <p class="slogan">${tagline}</p>
            
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-bar" id="searchInput" placeholder="Search for your favorite dish..." onkeyup="filterMenu()">
            </div>
        </header>

        <nav class="category-nav" id="categoryNav"></nav>
        <main id="menuContainer"></main>
        
        <div class="no-results" id="noResults">
            🍽️ Oops! We couldn't find that dish. Try searching for something else.
        </div>

        <footer>
            © 2026 ${title} • 100% Quality Guaranteed<br>
            Taxes applicable as per government rules.
        </footer>
    </div>

    <!-- Client-Side Render Logic Injected Automatically -->
    <script>
        const menuData = ${menuDataJSON};

        document.addEventListener('DOMContentLoaded', () => {
            renderNavigation();
            renderMenu();
        });

        function renderNavigation() {
            const navContainer = document.getElementById('categoryNav');
            
            const allBtn = document.createElement('button');
            allBtn.className = 'cat-pill active';
            allBtn.innerText = 'All Items';
            allBtn.onclick = () => scrollToCategory('all', allBtn);
            navContainer.appendChild(allBtn);

            menuData.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-pill';
                btn.innerText = cat.title;
                btn.onclick = () => scrollToCategory(cat.id, btn);
                navContainer.appendChild(btn);
            });
        }

        function renderMenu() {
            const menuContainer = document.getElementById('menuContainer');
            menuContainer.innerHTML = '';

            menuData.forEach(category => {
                const section = document.createElement('div');
                section.className = 'menu-section';
                section.id = category.id;

                const title = document.createElement('h2');
                title.className = 'section-title';
                title.innerHTML = \`\${category.title}\`;
                section.appendChild(title);

                category.items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.setAttribute('data-search', item.name.toLowerCase());

                    const indicatorClass = item.type === 'veg' ? 'veg-indicator' : 'veg-indicator nonveg-indicator';
                    const descBlock = item.desc ? \`<p class="item-desc">\${item.desc}</p>\` : '';

                    card.innerHTML = \`
                        <div class="item-info">
                            <div class="item-header">
                                <div class="\${indicatorClass}"></div>
                                <h3 class="item-name">\${item.name}</h3>
                            </div>
                            \${descBlock}
                        </div>
                        <div class="item-price">₹\${item.price}</div>
                    \`;
                    section.appendChild(card);
                });

                menuContainer.appendChild(section);
            });
        }

        function scrollToCategory(id, btnElement) {
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (id === 'all') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const section = document.getElementById(id);
                const y = section.getBoundingClientRect().top + window.scrollY - 150;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        function filterMenu() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const sections = document.querySelectorAll('.menu-section');
            let hasVisibleItems = false;

            sections.forEach(section => {
                const cards = section.querySelectorAll('.item-card');
                let sectionHasMatch = false;

                cards.forEach(card => {
                    const itemName = card.getAttribute('data-search');
                    if (itemName.includes(input)) {
                        card.style.display = 'flex';
                        sectionHasMatch = true;
                        hasVisibleItems = true;
                    } else {
                        card.style.display = 'none';
                    }
                });

                section.style.display = sectionHasMatch ? 'block' : 'none';
            });

            document.getElementById('noResults').style.display = hasVisibleItems ? 'none' : 'block';
        }
    <\/script>
</body>
</html>`;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title.toLowerCase().replace(/\s+/g, '-')}-premium-menu.html`;
            a.click();
        }

        function sendToWhatsApp() {
            const title = document.getElementById('inputBrandName').value || "Restaurant";
            let payload = `*NEW DIGITAL MENU CREATED!* 🍽️\n\n*Brand:* ${title}\n*Total Items:* ${menuItems.length}\n\n*Menu Breakdown:*\n`;

            menuItems.forEach((item, idx) => {
                payload += `${idx + 1}. [${item.category}] ${item.name} - ₹${item.price}\n`;
            });

            const encoded = encodeURIComponent(payload);
            window.open(`https://wa.me/919336157892?text=${encoded}`, '_blank');
        }
    </script>
</body>
</html>
