<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --btn-glass: rgba(255, 255, 255, 0.2);
            --accent-gold: #D4AF37;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            width: 100%;
            margin-top: 2vh;
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        
        .lang-btn.active {
            background: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: white; 
            padding: 5px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            object-fit: contain;
        }
        
        h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 26px; 
            margin: 0 0 5px 0; 
            line-height: 1.2;
        }
        
        p#slogan { 
            font-size: 13px; 
            font-style: italic; 
            color: #d1d1d1;
            margin: 0 0 25px 0; 
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--btn-glass);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        .btn:hover { background: rgba(255, 255, 255, 0.3); }
        .btn-google { border-left: 4px solid #4285F4; }
        .btn-insta { border-left: 4px solid #E1306C; }
        .btn-web { border-left: 4px solid var(--accent-gold); } 

        .btn-icon-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        #review-card {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            margin-top: 20px;
            animation: slideUp 0.4s ease-out;
            text-align: left;
        }

        #review-card p { font-weight: 500; margin-top: 0; font-size: 14px; }
        .sub-prompt { font-size: 12px !important; color: #d1d1d1; margin-bottom: 12px !important; }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 8px 14px;
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .tag-btn:hover { background: rgba(255,255,255,0.2); }
        
        .tag-btn.active-tag {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #111;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #review-action-area {
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #333;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            background-color: rgba(255,255,255,0.95);
            line-height: 1.5;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-refresh, .btn-copy {
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-refresh {
            background: rgba(255,255,255,0.2);
            color: white;
            flex: 1;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-refresh:hover { background: rgba(255,255,255,0.3); }

        .btn-copy { 
            background-color: var(--accent-gold); 
            color: #111; 
            flex: 2;
        }

        @keyframes slideUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>

        const productKeys = ['blinds', 'carpets', 'curtains', 'fabrics', 'mattresses', 'pillows', 'vertical_blinds', 'other'];
        let currentLang = 'mr'; 
        let selectedProducts = []; 
        
        const generatedReviews = { mr: {}, en: {}, hi: {} };
        const sequentialCounters = { mr: {}, en: {}, hi: {} };

        function initApp() {
            // Build the 100 variations + SHUFFLE THE SENTENCE STRUCTURE
            for (let lang in generatorData) {
                productKeys.forEach(prodKey => {
                    let sentences100 = [];
                    const p1Arr = generatorData[lang][prodKey].p1; 
                    const p2Arr = generatorData[lang][prodKey].p2; 
                    const p3Arr = generatorData[lang].shared_p3;   

                    for (let i = 0; i < p1Arr.length; i++) {
                        for (let j = 0; j < p2Arr.length; j++) {
                            for (let k = 0; k < p3Arr.length; k++) {
                                
                                let parts = [p1Arr[i], p2Arr[j], p3Arr[k]];
                                let order = (i + j + k) % 6; // Determines structure based on mathematical index
                                let sentence = "";

                                // Structural Shuffle - Reordering the placement of p1, p2, and p3
                                if (order === 0) sentence = `${parts[0]} ${parts[1]} ${parts[2]}`;
                                else if (order === 1) sentence = `${parts[0]} ${parts[2]} ${parts[1]}`;
                                else if (order === 2) sentence = `${parts[1]} ${parts[0]} ${parts[2]}`;
                                else if (order === 3) sentence = `${parts[1]} ${parts[2]} ${parts[0]}`;
                                else if (order === 4) sentence = `${parts[2]} ${parts[0]} ${parts[1]}`;
                                else if (order === 5) sentence = `${parts[2]} ${parts[1]} ${parts[0]}`;

                                sentences100.push(sentence);
                            }
                        }
                    }

                    // Scramble the 100 array so they don't play back in obvious thematic clumps
                    let mixed100 = new Array(100);
                    for (let i = 0; i < 100; i++) {
                        mixed100[(i * 27) % 100] = sentences100[i];
                    }

                    generatedReviews[lang][prodKey] = mixed100;
                    sequentialCounters[lang][prodKey] = 0; 
                });
            }
            setLanguage('mr');
        }

        function setLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');

            document.getElementById('slogan').innerText = generatorData[lang].slogan;
            document.getElementById('txt-google').innerText = generatorData[lang].google;
            document.getElementById('txt-insta').innerText = generatorData[lang].insta;
            document.getElementById('txt-web').innerText = generatorData[lang].web;
            document.getElementById('txt-prompt').innerText = generatorData[lang].prompt;
            document.getElementById('txt-sub-prompt').innerText = generatorData[lang].subPrompt;
            document.getElementById('txt-copy').innerText = generatorData[lang].copyBtn;
            document.getElementById('txt-rephrase').innerText = generatorData[lang].rephraseBtn;
            
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.style.backgroundColor = "#D4AF37";

            renderTags();

            if (selectedProducts.length > 0) {
                displayReview();
            }
        }

        function renderTags() {
            const container = document.getElementById('tags-container');
            container.innerHTML = '';
            
            productKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn ' + (selectedProducts.includes(key) ? 'active-tag' : '');
                btn.innerText = generatorData[currentLang].products[key];
                
                btn.onclick = () => toggleTag(key);
                
                container.appendChild(btn);
            });
        }

        function toggleTag(key) {
            const index = selectedProducts.indexOf(key);
            
            if (index > -1) {
                selectedProducts.splice(index, 1);
            } else {
                selectedProducts.push(key);
            }
            
            renderTags(); 
            
            if (selectedProducts.length > 0) {
                document.getElementById('review-action-area').style.display = 'block';
                displayReview();
            } else {
                document.getElementById('review-action-area').style.display = 'none';
            }
        }

        function triggerReviewCard() {
            document.getElementById('review-card').style.display = 'block';
            setTimeout(() => {
                document.getElementById('review-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function displayReview() {
            if(selectedProducts.length === 0) return;
            
            let combinedReview = [];
            
            selectedProducts.forEach(key => {
                let currentIndex = sequentialCounters[currentLang][key] % 100;
                combinedReview.push(generatedReviews[currentLang][key][currentIndex]);
                sequentialCounters[currentLang][key]++;
            });
            
            document.getElementById('review-text').value = combinedReview.join(' ');
            
            document.getElementById('copy-btn').style.backgroundColor = "#D4AF37";
            document.getElementById('txt-copy').innerText = generatorData[currentLang].copyBtn;
        }

        function copyAndRedirect() {
            const copyText = document.getElementById("review-text");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            
            navigator.clipboard.writeText(copyText.value).then(() => {
                const copyBtn = document.getElementById("copy-btn");
                document.getElementById('txt-copy').innerText = generatorData[currentLang].copiedMsg;
                copyBtn.style.backgroundColor = "#20c997"; 
                
                setTimeout(() => {
                    window.location.href = 'https://search.google.com/local/writereview?placeid=ChIJNfZ__w655zsRss9lwLQ40zA';
                }, 1500);
            });
        }
